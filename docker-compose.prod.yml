# 운영(EC2) 배포용. 서버의 .env 값을 사용한다 (.env.prod.example 참고).
#   docker compose -f docker-compose.prod.yml up -d --build
# 외부에 열리는 포트는 nginx 의 80/443 뿐이다. DB·Redis·백엔드는 내부 네트워크로만 접근한다.
name: smart-library-prod

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # NGINX_CONF=http(기본) 또는 https. 인증서 발급 전에는 http, 발급 후에는 https 를 쓴다.
      - ./deploy/nginx/${NGINX_CONF:-http}.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: .
    image: smart-library-backend:latest
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-smart_library}
      DB_USERNAME: ${DB_USERNAME:-capstone}
      DB_PASSWORD: ${DB_PASSWORD:?.env 에 DB_PASSWORD 를 설정하세요}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?.env 에 REDIS_PASSWORD 를 설정하세요}
      JWT_SECRET: ${JWT_SECRET:?.env 에 JWT_SECRET 을 설정하세요}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-30m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-14d}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?.env 에 CORS_ALLOWED_ORIGINS 를 설정하세요}
      # 선택: 비어 있으면 Vision 결과 수신 API 가 모든 요청을 거부한다 (배포가 실패하지 않는다)
      VISION_API_KEY: ${VISION_API_KEY:-}
      # 선택: 비어 있으면 JEV 평가 요청이 호출 없이 거부된다 (배포가 실패하지 않는다)
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_MODEL: ${JEV_MODEL:-jev-latest}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 주의: spring.profiles.active=dev 를 넣지 않는다. 넣으면 시드 계정이 운영 DB 에 들어간다.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    logging: *logging

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-smart_library}
      POSTGRES_USER: ${DB_USERNAME:-capstone}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env 에 DB_PASSWORD 를 설정하세요}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?.env 에 REDIS_PASSWORD 를 설정하세요}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  # HTTPS 인증서 발급·갱신용. 평소에는 뜨지 않고, 필요할 때만 run 으로 실행한다 (docs/DEPLOY.md).
  certbot:
    image: certbot/certbot
    profiles: ["tools"]
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt

volumes:
  postgres-data:
  redis-data:
  certbot-www:
  certbot-certs:
