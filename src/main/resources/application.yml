spring:
  application:
    name: smart-library
  config:
    # 루트의 .env 파일(KEY=VALUE)을 읽어 ${...} 에 사용 (없어도 무시)
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smart_library}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway(db/migration)로만 변경
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # 32바이트 이상. 반드시 .env 의 JWT_SECRET 으로 주입 (코드/커밋에 넣지 말 것)
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TTL:30m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:14d}
  cors:
    # 쉼표로 구분한 허용 origin. 비어 있으면 모두 거부 (.env 의 CORS_ALLOWED_ORIGINS)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  evaluation:
    # Backend 평가 지표(수요성·물리적 상태·중복성) 점수 규칙. 평가표가 확정되기 전의 임시 기준이며, 아래 값은 기본값이다.
    # 점수는 0~100 이고 높을수록 폐기 검토 필요도가 높다. 값을 바꿀 때만 주석을 풀어 쓴다.
    # metrics:
    #   demand:
    #     window-years: 3             # 최근 대출 건수를 세는 기간(년)
    #     loan-saturation: 5          # 기간 내 이 건수 이상 대출되면 대출 건수 점수 0
    #     recent-loan-weight: 0.6     # 대출 건수 점수 비중 (두 비중의 합은 1)
    #     recency-weight: 0.4         # 마지막 대출 경과 점수 비중
    #   condition:
    #     severity-score: {low: 30, medium: 60, high: 90}
    #     type-factor: {stain: 0.6, torn: 0.8, water-damage: 1.0, binding-damage: 1.0}
    #     default-severity: medium    # 심각도가 비어 있는 기록에 적용
    #     extra-report-bonus: 5       # 가장 나쁜 기록 외 기록 1건당 가산점
    #   duplication:
    #     saturation-copies: 4        # 같은 청구기호 도서가 이 권수 이상이면 100
  vision:
    # Vision 서버 전용 API Key (32자 이상). 비어 있으면 Vision 결과 수신 API 는 모든 요청을 거부한다.
    # 반드시 .env 의 VISION_API_KEY 로 주입 (코드/커밋에 넣지 말 것)
    api-key: ${VISION_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health   # 헬스체크만 노출
  endpoint:
    health:
      show-details: never

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.__found.smart_library: ${LOG_LEVEL:debug}
