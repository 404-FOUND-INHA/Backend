spring:
  application:
    name: smart-library
  config:
    # 루트의 .env 파일(KEY=VALUE)을 읽어 ${...} 에 사용 (없어도 무시)
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smart_library}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway(db/migration)로만 변경
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # 32바이트 이상. 반드시 .env 의 JWT_SECRET 으로 주입 (코드/커밋에 넣지 말 것)
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TTL:30m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:14d}
  cors:
    # 쉼표로 구분한 허용 origin. 비어 있으면 모두 거부 (.env 의 CORS_ALLOWED_ORIGINS)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  vision:
    # Vision 서버 전용 API Key (32자 이상). 비어 있으면 Vision 결과 수신 API 는 모든 요청을 거부한다.
    # 반드시 .env 의 VISION_API_KEY 로 주입 (코드/커밋에 넣지 말 것)
    api-key: ${VISION_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health   # 헬스체크만 노출
  endpoint:
    health:
      show-details: never

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.__found.smart_library: ${LOG_LEVEL:debug}
