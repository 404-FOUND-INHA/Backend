spring:
  application:
    name: smart-library
  config:
    # 루트의 .env 파일(KEY=VALUE)을 읽어 ${...} 에 사용 (없어도 무시)
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smart_library}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway(db/migration)로만 변경
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # 32바이트 이상. 반드시 .env 의 JWT_SECRET 으로 주입 (코드/커밋에 넣지 말 것)
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TTL:30m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:14d}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.__found.smart_library: ${LOG_LEVEL:debug}
