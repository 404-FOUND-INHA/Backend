# HTTP(80) 전용. 인증서 발급 전에 쓴다 (.env 의 NGINX_CONF=http).
# 이 모드에서는 /actuator/health 만 열린다. 인증서를 받은 뒤에는 NGINX_CONF=https 로 바꾼다 (docs/DEPLOY.md).
server {
    listen 80;
    server_name api.libsync.cloud;
    server_tokens off;
    client_max_body_size 1m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Let's Encrypt 도메인 확인용
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 인증서 발급 전(평문 HTTP)이므로 헬스체크만 열고 나머지 API 는 막는다.
    # 로그인 비밀번호·토큰이 평문으로 오가지 않게 하려는 것이다. 전체 API 는 HTTPS 전환 후 열린다.
    location = /actuator/health {
        # 변수로 지정해야 요청마다 Docker DNS 를 다시 조회한다.
        # (정적 주소는 nginx 시작 시점의 IP 를 계속 써서, 백엔드 재생성 후 502 가 난다)
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location / {
        return 403;
    }
}
