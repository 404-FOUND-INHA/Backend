# HTTPS. 인증서 발급이 끝난 뒤 .env 의 NGINX_CONF=https 로 쓴다.
# 인증서가 없는 상태에서 이 설정을 쓰면 nginx 가 뜨지 않는다.
server {
    listen 80;
    server_name api.libsync.cloud;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.libsync.cloud;
    server_tokens off;
    client_max_body_size 1m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate     /etc/letsencrypt/live/api.libsync.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.libsync.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        # 변수로 지정해야 요청마다 Docker DNS 를 다시 조회한다.
        # (정적 주소는 nginx 시작 시점의 IP 를 계속 써서, 백엔드 재생성 후 502 가 난다)
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
